name: Actualizar estadísticas del perfil

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Generar tarjetas desde la API pública de GitHub
        run: node scripts/update-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publicar las tarjetas actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "Las tarjetas ya están actualizadas."
          else
            git commit -m "Actualizar estadísticas del perfil"
            git push
          fi
